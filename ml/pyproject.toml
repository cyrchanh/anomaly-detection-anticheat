[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fmac"
version = "0.1.0"
description = "Flow-matching anticheat: feature reference implementation, training and evaluation"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "jsonschema>=4.19"]

[project.optional-dependencies]
dev = ["pytest>=8", "numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
